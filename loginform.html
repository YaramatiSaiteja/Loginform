<DOCTYPE html>
    <html lang="en">
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width,initial-scale=1.0">
            <link rel="stylesheet"href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
            <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
            <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js" integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN" crossorigin="anonymous"></script>
            <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js" integrity="sha384-B4gt1jrGC7Jh4AgTPSdUtOBvfO8shuf57BaghqFfPlYxofvL8/KUEfYiJOMMV+rV" crossorigin="anonymous"></script>
            <link rel="stylesheet" href="loginform.css">
            <title>Project 2</title>
        </head>
        <body>
            <div id="mainContainer" class="maincontainer d-flex flex-column align-items-center">
                <h1 class="text-center mb-4">Login</h1>
                <div class="card">
                    <form id="loginForm">
                        <label for="username" class="label">Username</label><br>
                        <input type="text" id="username" class="mb-2 label-control" placeholder = "Enter your username"/><br>
                        <p id="usernameError" class="text-danger"></p>
                        <label for="password" class="label">Password</label><br>
                        <input type="password" id="password" class="mb-2 label-control" placeholder = "Enter your password"/><br>
                        <p id="passwordError" class="text-danger"></p>
                        <button type="submit" class="btn btn-primary mt-4">Login</button>
                    </form>
                </div>
            </div>
            <script src="loginform.js"></script>
        </body>
    </html>
